services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1435:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TvojaJakaLozinka123!

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: .
      dockerfile: HireMatch.WebAPI/Dockerfile
    ports:
      - "5086:5086"
    env_file:
      - .env.docker
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5086
    depends_on:
      - sqlserver
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: HireMatch.Worker/Dockerfile
    env_file:
      - .env.docker
    depends_on:
      - sqlserver
      - rabbitmq